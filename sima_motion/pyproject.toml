[build-system]
requires = ["setuptools>=68", "wheel", "cython>=3.0", "numpy>=1.25"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-motion"
version = "1.0.0"
description = "Motion correction for fluorescence imaging data (extracted from SIMA)"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Patrick Kaifosh"},
    {name = "Jeffrey D. Zaremba"},
    {name = "Nathan B. Danielson"},
    {name = "Attila Losonczy"},
]
dependencies = [
    "numpy>=1.25",
    "scipy>=1.10",
]

[project.optional-dependencies]
fast = ["pyfftw>=0.13", "bottleneck>=1.3"]
dev = ["pytest>=7", "cython>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sima_motion*"]

[tool.pytest.ini_options]
testpaths = ["sima_motion/tests"]
